name: Linux CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "3"
  MKL_THREADING_LAYER: TBB
  MKL_DYNAMIC: "FALSE"
  MKL_NUM_THREADS: "2"
  PYPGO_CMAKE_PRESET: pypgo-wheel-mkl

jobs:
  build-test-package:
    name: Linux x86-64 build, test, and wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Miniforge
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: 26.3.2-3
          activate-environment: libpgo-build
          auto-activate-base: false
          use-mamba: true
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true

      - name: Install pinned build environment
        run: |
          mamba install -y -c conda-forge --strict-channel-priority \
            "python=3.12" "cmake=4.3" "ninja=1.13" \
            "numpy=2.5" "pip=26.1" "setuptools=82" "wheel=0.47" \
            "python-build=1.3" "pytest=9.0" \
            "gmp=6.3" "mpfr=4.2" "imath=3.2" "fmt=12" \
            "tbb=2023.0" "tbb-devel=2023.0" \
            "mkl-devel=2025.3" "libblas=*=*mkl" "liblapack=*=*mkl" \
            auditwheel patchelf
          echo "MKLROOT=${CONDA_PREFIX}" >> "${GITHUB_ENV}"
          echo "NATIVE_BUILD=${RUNNER_TEMP}/libpgo-native" >> "${GITHUB_ENV}"
          echo "INSTALL_PREFIX=${RUNNER_TEMP}/libpgo-install" >> "${GITHUB_ENV}"
          echo "WHEEL_DIR=${RUNNER_TEMP}/wheelhouse" >> "${GITHUB_ENV}"
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/evidence" >> "${GITHUB_ENV}"

      - name: Record dependency environment
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          conda config --show-sources | tee "${EVIDENCE_DIR}/conda-config.txt"
          conda list | tee "${EVIDENCE_DIR}/conda-list.txt"
          conda list --explicit | tee "${EVIDENCE_DIR}/conda-explicit.txt"
          {
            python --version
            cmake --version
            ninja --version
            c++ --version
            echo "MKLROOT=${MKLROOT}"
            echo "MKL_THREADING_LAYER=${MKL_THREADING_LAYER}"
          } | tee "${EVIDENCE_DIR}/toolchain.txt"

      - name: Configure and build native tree
        run: |
          cmake --preset pypgo-wheel-mkl \
            -B "${NATIVE_BUILD}" \
            -G Ninja \
            -DBUILD_TESTING=ON \
            -DPYPGO_VERSION_INFO=0.0.4
          cmake --build "${NATIVE_BUILD}" -j 3

      - name: Run native and CLI smoke tests
        run: |
          set -o pipefail
          ctest --test-dir "${NATIVE_BUILD}" --output-on-failure \
            | tee "${EVIDENCE_DIR}/ctest.txt"

      - name: Verify installed C package
        run: |
          cmake --install "${NATIVE_BUILD}" --prefix "${INSTALL_PREFIX}"
          cmake -S src/tests/testPgo_c -B "${RUNNER_TEMP}/pgo-c-consumer" -G Ninja \
            -DCMAKE_PREFIX_PATH="${INSTALL_PREFIX};${CONDA_PREFIX}"
          cmake --build "${RUNNER_TEMP}/pgo-c-consumer"
          LD_LIBRARY_PATH="${INSTALL_PREFIX}/lib:${CONDA_PREFIX}/lib" \
            "${RUNNER_TEMP}/pgo-c-consumer/pgo_c_test" \
            "${GITHUB_WORKSPACE}/examples/assets/common/torus-tet.veg" \
            | tee "${EVIDENCE_DIR}/c-consumer.txt"

      - name: Lock source provenance
        run: |
          python scripts/release_wheel_provenance.py preflight \
            --evidence-dir "${EVIDENCE_DIR}"

      - name: Build one wheel without sdist
        run: |
          mkdir -p "${WHEEL_DIR}"
          python -m build --wheel --no-isolation --outdir "${WHEEL_DIR}"
          test "$(find "${WHEEL_DIR}" -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test -z "$(find "${WHEEL_DIR}" -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Audit final wheel without repair
        run: |
          wheel="$(find "${WHEEL_DIR}" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m auditwheel show "${wheel}" | tee "${EVIDENCE_DIR}/auditwheel.txt"
          python scripts/audit_release_wheel.py \
            --platform linux \
            --wheel "${wheel}" \
            --source-dir "${GITHUB_WORKSPACE}" \
            | tee "${EVIDENCE_DIR}/wheel-linkage.txt"

      - name: Verify wheel in fresh runtime environment
        run: |
          runtime="${RUNNER_TEMP}/libpgo-runtime"
          conda create -y -p "${runtime}" -c conda-forge --strict-channel-priority \
            "python=3.12" "pip=26.1" "numpy=2.5" "pytest=9.0" \
            "gmp=6.3" "mpfr=4.2" "imath=3.2" "fmt=12" \
            "tbb=2023.0" \
            "libblas=*=*mkl" "liblapack=*=*mkl"
          wheel="$(find "${WHEEL_DIR}" -maxdepth 1 -name '*.whl' -print -quit)"
          conda run -p "${runtime}" python -m pip install --no-deps "${wheel}"
          conda run -p "${runtime}" python -m pip check
          workdir="$(mktemp -d)"
          cd "${workdir}"
          conda run -p "${runtime}" env \
            MKL_THREADING_LAYER=TBB MKL_DYNAMIC=FALSE MKL_NUM_THREADS=2 \
            python "${GITHUB_WORKSPACE}/scripts/installed_wheel_smoke.py" \
              --platform linux --source-dir "${GITHUB_WORKSPACE}" \
            | tee "${EVIDENCE_DIR}/installed-smoke.txt"
          conda run -p "${runtime}" python -m pytest -q \
            "${GITHUB_WORKSPACE}/tests/pypgo/test_pgo_smoke.py" \
            | tee "${EVIDENCE_DIR}/installed-pytest.txt"

      - name: Finalize provenance
        run: |
          python scripts/release_wheel_provenance.py record \
            --evidence-dir "${EVIDENCE_DIR}" \
            --wheel-dir "${WHEEL_DIR}" \
            --cmake-cache "${NATIVE_BUILD}/CMakeCache.txt" \
            --dependency-evidence "${EVIDENCE_DIR}/conda-explicit.txt" \
            --dependency-evidence "${EVIDENCE_DIR}/wheel-linkage.txt" \
            --test-evidence "${EVIDENCE_DIR}/ctest.txt" \
            --test-evidence "${EVIDENCE_DIR}/installed-smoke.txt"
          shasum -a 256 "${WHEEL_DIR}"/*.whl | tee "${EVIDENCE_DIR}/wheel.sha256"

      - name: Upload wheel and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypgo-0.0.4-linux-x86_64
          path: |
            ${{ env.WHEEL_DIR }}/*.whl
            ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
