name: macOS CI

on:
  push:
    branches:
      - main
      - master
      - original/*
      - codex/**
  pull_request:
  workflow_dispatch:

jobs:
  python-build-and-test:
    name: Python Build and Test
    runs-on: macos-15
    timeout-minutes: 120

    defaults:
      run:
        shell: bash -l {0}

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: libpgo
          auto-activate-base: false
          use-mamba: true
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict

      - name: Install Conda packages
        run: |
          mamba install -y \
            "cmake>=3.29" \
            ninja \
            numpy \
            pip \
            pytest \
            setuptools \
            tbb-devel \
            wheel

      - name: Install Homebrew prerequisites
        run: brew install gmp mpfr imath

      - name: Build and install Python package
        run: python -m pip install -e . --no-build-isolation

      - name: Run Python API pytest suite
        run: python -m pytest -q tests/pypgo

  cmake-build:
    name: CMake Preset Build and Test
    runs-on: macos-15
    timeout-minutes: 120

    defaults:
      run:
        shell: bash -l {0}

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: libpgo
          auto-activate-base: false
          use-mamba: true
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict

      - name: Install Conda packages
        run: |
          mamba install -y \
            "cmake>=3.29" \
            gmsh \
            ninja \
            openvdb \
            tbb-devel

      - name: Install Homebrew prerequisites
        run: brew install gmp mpfr imath

      - name: Configure with preset base and tests enabled
        run: |
          cmake --preset base \
            -DBUILD_TESTING=ON

      - name: Build with preset base
        run: cmake --build --preset base

      - name: Run CTest
        run: ctest --test-dir build/base --output-on-failure
