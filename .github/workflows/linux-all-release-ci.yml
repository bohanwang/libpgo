name: Linux All Release CI

on:
  push:
    branches:
      - main
      - master
      - original/**
      - codex/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-release:
    name: all_release preset
    runs-on: [self-hosted, linux, libpgo-all-release]
    timeout-minutes: 360

    defaults:
      run:
        shell: bash -l {0}

    env:
      KNITRODIR: /opt/artelys/knitro-15.0.1-Linux64
      PARDISOROOT: /opt/panua-pardiso-20240229-linux
      KNITRO_LIBRARY_HINT: /opt/artelys/knitro-15.0.1-Linux64
      PARDISO_LIBRARY_HINT: /opt/panua-pardiso-20240229-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check all_release runner prerequisites
        run: |
          set -euo pipefail

          cmake --version
          g++ --version

          if ! command -v nvcc >/dev/null 2>&1; then
            echo "::error::all_release enables CUDA, but nvcc is not on PATH."
            exit 1
          fi
          nvcc --version

          if [ ! -f /opt/intel/oneapi/setvars.sh ]; then
            echo "::error::MKL preset requires Intel oneAPI at /opt/intel/oneapi."
            exit 1
          fi

          if [ ! -d "$KNITRODIR" ]; then
            echo "::error::all_release enables Knitro, but KNITRODIR does not exist: $KNITRODIR"
            exit 1
          fi

          if [ ! -d "$PARDISOROOT" ]; then
            echo "::error::all_release enables original Pardiso, but PARDISOROOT does not exist: $PARDISOROOT"
            exit 1
          fi

      - name: Configure all_release
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/setvars.sh --force
          cmake --preset all_release -DBUILD_TESTING=ON

      - name: Build all_release
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/setvars.sh --force
          cmake --build --preset all_release

      - name: Run CTest
        run: |
          set -euo pipefail
          source /opt/intel/oneapi/setvars.sh --force
          ctest --test-dir build/all_release --output-on-failure --timeout 900
