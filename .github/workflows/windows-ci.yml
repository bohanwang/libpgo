name: Windows CI

on:
  push:
    branches:
      - main
      - master
      - original/*
      - codex/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-build-and-test:
    name: Python Build and Test
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: libpgo-ci
          auto-activate-base: false
          use-mamba: true
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict

      - name: Install Conda packages
        run: |
          mamba install -y `
            "cmake>=3.29" `
            imath `
            mkl-devel `
            ninja `
            numpy `
            pytest `
            setuptools `
            wheel

      - name: Build and install Python package
        run: |
          # Strip mingw/Strawberry gfortran so Eigen's optional Fortran probe
          # does not pick an MSVC-incompatible compiler. Build with Ninja + MSVC.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry' }) -join ';'
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CMAKE_ARGS = "-DCMAKE_PREFIX_PATH=$env:CONDA_PREFIX/Library"
          python setup.py build_ext --inplace

      - name: Run Python API pytest suite
        run: python -m pytest -q tests/pypgo

  cmake-build:
    name: CMake Preset Build and Test
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: libpgo-ci
          auto-activate-base: false
          use-mamba: true
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict

      - name: Install Conda packages
        run: |
          mamba install -y `
            "cmake>=3.29" `
            imath `
            mkl-devel `
            ninja

      - name: Configure with preset base and tests enabled
        run: |
          # The runner ships mingw/Strawberry gfortran on PATH. Eigen's bundled
          # blas/lapack call enable_language(Fortran OPTIONAL), which still fails
          # fatally when a found compiler is incompatible with the MSVC toolchain.
          # Drop those directories so no Fortran compiler is discovered.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry' }) -join ';'
          # Defer gtest discovery to test time; running the test exes at build
          # time fails on Windows because their runtime DLLs are not co-located.
          cmake --preset base -G Ninja -DBUILD_TESTING=ON `
            -DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST

      - name: Build with preset base
        run: cmake --build --preset base

      - name: Run CTest
        run: |
          # Drop mingw/Strawberry so any CMake re-run during discovery stays on
          # the MSVC toolchain, then put every built DLL directory (pgo_c.dll,
          # etc.) plus the conda runtime (MKL/TBB/GMP/MPFR) on PATH so the test
          # executables load.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'mingw' -and $_ -notmatch 'Strawberry' }) -join ';'
          $dllDirs = (Get-ChildItem -Path build/base -Recurse -Filter *.dll |
            Select-Object -ExpandProperty DirectoryName -Unique) -join ';'
          $env:PATH = "$dllDirs;$env:CONDA_PREFIX\Library\bin;$env:PATH"
          ctest --test-dir build/base --output-on-failure
