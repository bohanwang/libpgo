name: Windows CI

on:
  push:
    branches: [main, "release/**", add-no-conda]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test Windows x86-64
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Set up uv dependencies
        shell: pwsh
        run: |
          $uvVersion = python scripts/uv_version.py
          python -m pip install "uv==$uvVersion"
          uv sync --locked --python python
          $venv = (Resolve-Path .venv).Path
          @(
            "$venv\Library\bin"
            "$env:GITHUB_WORKSPACE\third-party\gmp-msvc\release"
            "$env:GITHUB_WORKSPACE\third-party\mpfr-msvc\release"
          ) | Out-File $env:GITHUB_PATH -Append
          "EVIDENCE_DIR=$env:RUNNER_TEMP\native-evidence" | Out-File $env:GITHUB_ENV -Append
          "PYPGO_VERSION=$(.\.venv\Scripts\python.exe scripts/project_version.py)" | Out-File $env:GITHUB_ENV -Append

      - name: Record dependency environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:EVIDENCE_DIR | Out-Null
          uv pip freeze | Tee-Object "$env:EVIDENCE_DIR\uv-freeze.txt"
          @(
            uv --version
            uv run python --version
            uv run cmake --version
            uv run ninja --version
            cl
            uv run python -c "import sys; print('python_prefix=' + sys.prefix)"
          ) | Out-File "$env:EVIDENCE_DIR\toolchain.txt"

      - name: Build and test from the build tree
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv run cmake --preset pypgo-wheel
          uv run cmake --build build\pypgo
          uv run ctest --test-dir build\pypgo --output-on-failure `
            | Tee-Object "$env:EVIDENCE_DIR\ctest.txt"
          if ($LASTEXITCODE -ne 0) { throw "CTest failed" }
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\build\pypgo\src\python\pypgo"
          uv run python -m pytest -q tests\pypgo\test_pgo_smoke.py `
            | Tee-Object "$env:EVIDENCE_DIR\build-tree-pytest.txt"
          if ($LASTEXITCODE -ne 0) { throw "Build-tree pytest failed" }
          Copy-Item build\pypgo\CMakeCache.txt "$env:EVIDENCE_DIR\CMakeCache.txt"

      - name: Upload native test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypgo-native-evidence-windows
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package Windows x86-64 wheel
    needs: build-test
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Set up uv dependencies
        shell: pwsh
        run: |
          $uvVersion = python scripts/uv_version.py
          python -m pip install "uv==$uvVersion"
          uv sync --locked --python python
          "RAW_WHEEL_DIR=$env:RUNNER_TEMP\raw-wheel" | Out-File $env:GITHUB_ENV -Append
          "WHEEL_DIR=$env:RUNNER_TEMP\wheelhouse" | Out-File $env:GITHUB_ENV -Append
          "EVIDENCE_DIR=$env:RUNNER_TEMP\evidence" | Out-File $env:GITHUB_ENV -Append
          "PYPGO_VERSION=$(.\.venv\Scripts\python.exe scripts/project_version.py)" | Out-File $env:GITHUB_ENV -Append

      - name: Download native test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypgo-native-evidence-windows
          path: ${{ env.EVIDENCE_DIR }}

      - name: Record package dependency environment
        shell: pwsh
        run: |
          uv pip freeze | Tee-Object "$env:EVIDENCE_DIR\package-uv-freeze.txt"

      - name: Lock source provenance
        shell: pwsh
        run: |
          uv run python scripts/release_wheel_provenance.py preflight `
            --evidence-dir "$env:EVIDENCE_DIR"

      - name: Build and repair wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:RAW_WHEEL_DIR | Out-Null
          New-Item -ItemType Directory -Force $env:WHEEL_DIR | Out-Null
          uv build --wheel --no-build-isolation --out-dir "$env:RAW_WHEEL_DIR"
          $rawWheel = @(Get-ChildItem $env:RAW_WHEEL_DIR -Filter '*.whl')[0].FullName
          $venv = (Resolve-Path .venv).Path
          $nativePaths = @(
            "$venv\Library\bin",
            "$env:GITHUB_WORKSPACE\third-party\gmp-msvc\release",
            "$env:GITHUB_WORKSPACE\third-party\mpfr-msvc\release"
          ) -join ';'
          $mklDispatchDlls = @(
            "mkl_def.2.dll",
            "mkl_mc3.2.dll",
            "mkl_avx2.2.dll",
            "mkl_avx512.2.dll",
            "mkl_vml_def.2.dll",
            "mkl_vml_cmpt.2.dll",
            "mkl_vml_mc3.2.dll",
            "mkl_vml_avx2.2.dll",
            "mkl_vml_avx512.2.dll"
          ) -join ':'
          uv run python -m delvewheel repair `
            --add-path $nativePaths `
            --include $mklDispatchDlls `
            --wheel-dir "$env:WHEEL_DIR" `
            $rawWheel
          $wheels = @(Get-ChildItem $env:WHEEL_DIR -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw "Expected one repaired wheel" }

      - name: Audit repaired wheel
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem $env:WHEEL_DIR -Filter '*.whl')[0].FullName
          uv run python -m delvewheel show $wheel | Tee-Object "$env:EVIDENCE_DIR\delvewheel.txt"
          uv run python scripts/audit_release_wheel.py `
            --platform windows `
            --wheel $wheel `
            --source-dir "$env:GITHUB_WORKSPACE" `
            | Tee-Object "$env:EVIDENCE_DIR\wheel-linkage.txt"
          if ($LASTEXITCODE -ne 0) { throw "Wheel audit failed" }

      - name: Verify wheel in a fresh venv
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP\pypgo-runtime"
          uv venv --python 3.12 $runtime
          $runtimePython = "$runtime\Scripts\python.exe"
          uv pip install --python $runtimePython "numpy==2.0.2" "pytest==8.4.2"
          $wheel = @(Get-ChildItem $env:WHEEL_DIR -Filter '*.whl')[0].FullName
          uv pip install --python $runtimePython --no-deps $wheel
          & $runtimePython scripts/installed_wheel_smoke.py `
            --platform windows --source-dir "$env:GITHUB_WORKSPACE" `
            | Tee-Object "$env:EVIDENCE_DIR\installed-smoke.txt"
          if ($LASTEXITCODE -ne 0) { throw "Installed wheel smoke failed" }
          & $runtimePython -m pytest -q tests/pypgo/test_pgo_smoke.py `
            | Tee-Object "$env:EVIDENCE_DIR\installed-pytest.txt"
          if ($LASTEXITCODE -ne 0) { throw "Installed wheel pytest failed" }

      - name: Finalize provenance
        shell: pwsh
        run: |
          uv run python scripts/release_wheel_provenance.py record `
            --evidence-dir "$env:EVIDENCE_DIR" `
            --wheel-dir "$env:WHEEL_DIR" `
            --cmake-cache "$env:EVIDENCE_DIR\CMakeCache.txt" `
            --dependency-evidence "$env:EVIDENCE_DIR\uv-freeze.txt" `
            --dependency-evidence "$env:EVIDENCE_DIR\package-uv-freeze.txt" `
            --dependency-evidence "$env:EVIDENCE_DIR\wheel-linkage.txt" `
            --test-evidence "$env:EVIDENCE_DIR\ctest.txt" `
            --test-evidence "$env:EVIDENCE_DIR\build-tree-pytest.txt" `
            --test-evidence "$env:EVIDENCE_DIR\installed-smoke.txt" `
            --test-evidence "$env:EVIDENCE_DIR\installed-pytest.txt"
          Get-FileHash "$env:WHEEL_DIR\*.whl" -Algorithm SHA256 `
            | Format-List | Out-File "$env:EVIDENCE_DIR\wheel.sha256"

      - name: Upload wheel and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypgo-${{ env.PYPGO_VERSION }}-windows-x86_64
          path: |
            ${{ env.WHEEL_DIR }}/*.whl
            ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
