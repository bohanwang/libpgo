site_name: libpgo
site_description: Documentation for libpgo — physically based simulation, geometric shape modeling, and optimization
site_url: https://annajcy.github.io/libpgo/
repo_url: https://github.com/annajcy/libpgo
edit_uri: edit/main/docs/
strict: false

theme:
  name: material
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Build System Documentation: build-system.md
  - Walkthrough:
      - Overview: walkthrough/index.md
      - Simulation Pre-Tick Setup: walkthrough/simulation-tick-pre-tick.md
      - Build System:
          - Overview: walkthrough/build_system/index.md
          - "Phase 01: Stack and Entrypoints": walkthrough/build_system/phase01_stack_and_entrypoints.md
          - "Phase 02: Conan Bootstrap": walkthrough/build_system/phase02_conan_bootstrap.md
          - "Phase 03: Root CMake Graph": walkthrough/build_system/phase03_root_cmake_graph.md
          - "Phase 04: Recipes, Python, and CI": walkthrough/build_system/phase04_recipes_python_ci.md
      - Cubic Mesh:
          - Overview: walkthrough/cubic_mesh/index.md
          - "Phase 01: Mesh Assets": walkthrough/cubic_mesh/phase01_mesh_assets.md
          - "Phase 02: Config and Runtime Entry": walkthrough/cubic_mesh/phase02_config_runtime_entry.md
          - "Phase 03: Simulation Mesh": walkthrough/cubic_mesh/phase03_simulation_mesh.md
          - "Phase 04: Element Model": walkthrough/cubic_mesh/phase04_element_model.md
          - "Phase 05: Energy Assembly": walkthrough/cubic_mesh/phase05_energy_assembly.md
          - "Phase 06: Full Runtime and Examples": walkthrough/cubic_mesh/phase06_full_runtime_examples.md
      - IPC:
