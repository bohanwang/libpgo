[build-system]
requires = [
    "setuptools>=42",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pypgo"
version = "0.0.4"
description = "Python bindings for libpgo physical simulation and geometry processing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
authors = [
    { name = "Bohan Wang", email = "wangbh11@gmail.com" },
]
dependencies = [
    "numpy>=1.26",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
]

[project.urls]
Homepage = "https://github.com/annajcy/libpgo"
Source = "https://github.com/annajcy/libpgo"
Issues = "https://github.com/annajcy/libpgo/issues"

[dependency-groups]
dev = [
    "cmake==4.3.1",
    "mkl-devel==2025.3.1; sys_platform == 'linux' or sys_platform == 'win32'",
    "ninja==1.13.0",
    "numpy==2.0.2",
    "pytest==8.4.2",
    "setuptools==82.0.1",
    "wheel==0.47.0",
]
release = [
    { include-group = "dev" },
    "auditwheel==6.4.2; sys_platform == 'linux'",
    "delocate==0.13.0; sys_platform == 'darwin'",
    "delvewheel==1.13.0; sys_platform == 'win32'",
    "patchelf==0.17.2.4; sys_platform == 'linux'",
]

[tool.uv]
default-groups = ["release"]
package = false
required-version = "==0.11.6"

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.12,<3.13" }
release = { requires-python = ">=3.12,<3.13" }
